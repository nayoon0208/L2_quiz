<style>
/* Layout: one question per screen, case-file feel; evidence-marker tents number the questions */
:root {
  --bg: #EEF1F4;
  --surface: #FFFFFF;
  --ink: #16212B;
  --muted: #5B6975;
  --line: #D3DAE1;
  --note: #F5F7F9;
  --marker: #F2B705;
  --marker-ink: #2B2100;
  --accent: #1F4E79;
  --accent-ink: #FFFFFF;
  --good: #1E7A4F;
  --good-bg: #E3F3EA;
  --bad: #B4372B;
  --bad-bg: #FBE9E6;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --font-display: 'Noto Serif KR', 'Apple SD Gothic Neo', 'Malgun Gothic', serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10171D; --surface: #18222B; --ink: #E7EDF2; --muted: #9AA8B4; --line: #2B3946;
    --note: #1D2933; --marker: #F2B705; --marker-ink: #1E1700; --accent: #6FA8DC; --accent-ink: #0B1722;
    --good: #6FD0A0; --good-bg: #15332A; --bad: #FF9A8D; --bad-bg: #3A1E1B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10171D; --surface: #18222B; --ink: #E7EDF2; --muted: #9AA8B4; --line: #2B3946;
  --note: #1D2933; --marker: #F2B705; --marker-ink: #1E1700; --accent: #6FA8DC; --accent-ink: #0B1722;
  --good: #6FD0A0; --good-bg: #15332A; --bad: #FF9A8D; --bad-bg: #3A1E1B;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* Start screen */
.start { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 28px 22px; display: flex; flex-direction: column; gap: 18px; }
.start h1 { font-family: var(--font-display); font-size: clamp(28px, 7vw, 38px); line-height: 1.2; margin: 0; text-wrap: balance; }
.start .sub { margin: 0; color: var(--muted); }
.secs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.secs li { display: flex; align-items: baseline; gap: 12px; padding: 10px 12px; background: var(--note); border-radius: 6px; }
.secs .l { font-family: var(--font-mono); font-weight: 700; width: 1.4em; }
.secs .n { flex: 1; min-width: 0; }
.secs .r { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 13px 20px; font-weight: 600; font-size: 16px; }
.primary:hover { filter: brightness(1.08); }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 12px 18px; font-weight: 500; }
.ghost:hover { border-color: var(--muted); }

/* Progress */
.top { display: grid; gap: 8px; margin-bottom: 14px; }
.crumb { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.crumb .sec { color: var(--muted); }
.crumb .count { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .25s ease; }

/* Question */
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px 18px; display: grid; gap: 16px; }
.qhead { display: flex; gap: 14px; align-items: flex-start; }
.tent { flex: none; width: 40px; height: 40px; background: var(--marker); color: var(--marker-ink); clip-path: polygon(14% 0, 86% 0, 100% 100%, 0 100%); display: grid; place-items: end center; padding-bottom: 5px; }
.tent b { font-family: var(--font-mono); font-size: 16px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.qhead h2 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.55; min-width: 0; text-wrap: pretty; }
.box { background: var(--note); border-left: 3px solid var(--marker); border-radius: 4px; padding: 12px 14px; display: grid; gap: 6px; min-width: 0; }
.box p { margin: 0; overflow-wrap: anywhere; }
.box u { text-decoration-thickness: 2px; text-underline-offset: 3px; }

.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; transition: border-color .15s, background .15s; }
.opt .mk { flex: none; font-size: 17px; line-height: 1.5; width: 1.3em; }
.opt .tx { min-width: 0; overflow-wrap: anywhere; padding-top: 1px; }
.opts:not(.locked) .opt:hover { border-color: var(--accent); background: var(--note); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opts.locked .opt { cursor: default; }

.field { display: grid; gap: 10px; }
.field label { font-size: 14px; color: var(--muted); }
.field input[type="text"], .field select { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 0; }
.field input[type="text"]:disabled, .field select:disabled { opacity: .75; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--note); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 15px; }
.chip:disabled { opacity: .6; cursor: default; }
.chip:not(:disabled):hover { border-color: var(--accent); }
.sentence { margin: 0; display: block; line-height: 2.4; overflow-wrap: break-word; }
.sentence select { display: inline-block; width: auto; min-width: 130px; max-width: 100%; margin: 0 2px; vertical-align: baseline; }
.bank { font-family: var(--font-mono); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }

.fb { border-radius: 8px; padding: 14px 16px; display: grid; gap: 6px; border: 1px solid transparent; }
.fb.good { background: var(--good-bg); border-color: var(--good); }
.fb.bad { background: var(--bad-bg); border-color: var(--bad); }
.fb .verdict { margin: 0; font-weight: 700; }
.fb.good .verdict { color: var(--good); }
.fb.bad .verdict { color: var(--bad); }
.fb p { margin: 0; overflow-wrap: anywhere; }
.fb .key { font-family: var(--font-mono); font-size: 14px; }
.actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }

/* Result */
.result { display: grid; gap: 18px; }
.score { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px 22px; display: grid; gap: 14px; }
.score .big { font-family: var(--font-display); font-size: clamp(44px, 12vw, 64px); line-height: 1; font-variant-numeric: tabular-nums; }
.score .big small { font-family: var(--font-body); font-size: 18px; color: var(--muted); font-weight: 400; margin-left: 6px; }
.brk { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.brk li { display: flex; gap: 12px; align-items: baseline; font-size: 15px; }
.brk .n { flex: 1; min-width: 0; }
.brk .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.key-grid { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 12px; }
.key-grid h3 { margin: 0; font-size: 16px; }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.cell { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.cell.ok { background: var(--good-bg); border-color: var(--good); }
.cell.no { background: var(--bad-bg); border-color: var(--bad); }
.cell span:last-child { font-family: var(--font-body); }
.subj { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-size: 15px; overflow-wrap: anywhere; }
.row-actions { display: flex; flex-wrap: wrap; gap: 10px; }

@media (prefers-reduced-motion: reduce) { .bar i, .opt { transition: none; } }
</style>

    { id: 14, sec: 'C', type: 'mc',
      stem: '밑줄 친 It의 쓰임이 나머지 넷과 다른 것은?',
      options: ['<u>It</u> was not until she was in her fifties that Lee was able to start a career.', '<u>It</u> was my cell phone that disrupted the silence in the library.', '<u>It</u> was during the storm that I realized the power of nature.', '<u>It</u> is no wonder that she was called the “mother of forensic science.”', '<u>It</u> was the delicious smell that led me to the restaurant.'],
      html: true,
      answer: 3,
      exp: '④는 가주어 It(진주어 that절)입니다. 나머지는 모두 It is[was] ~ that 강조 구문입니다.' },

    { id: 15, sec: 'D', type: 'text',
      stem: '다음 우리말과 같은 뜻이 되도록 괄호 안의 말을 바르게 배열하시오.',
      box: ['그녀가 ‘과학 수사의 어머니’로 불린 것은 놀랍지 않다.', '( is / called / that / it / she was / no wonder / the / “mother of forensic science.” )'],
      chips: ['is', 'called', 'that', 'it', 'she was', 'no wonder', 'the', '“mother of forensic science.”'],
      hint: '단어를 눌러 순서대로 이어 붙여 문장을 완성하세요. 직접 입력해서 고쳐도 됩니다.',
      accept: ['It is no wonder that she was called', 'It is no wonder that she was called the “mother of forensic science.”'],
      show: 'It is no wonder that she was called the “mother of forensic science.”',
      exp: 'It is no wonder that ~: ~은 놀랍지 않다 (가주어 It)' },
    { id: 16, sec: 'D', type: 'text',
      stem: '다음 문장의 밑줄 친 부분을 강조하는 문장으로 바꿔 쓰시오.',
      box: ['<u>In 1945</u>, she held a week-long seminar.'],
      hint: '힌트: It was + 강조할 말 + that + 나머지 형식으로 쓰면 됩니다.',
      accept: ['It was in 1945 that she held a week-long seminar'],
      show: 'It was in 1945 that she held a week-long seminar.',
      exp: 'It was + 강조할 말 + that + 나머지' },
    { id: 17, sec: 'D', type: 'fill',
      stem: '다음은 본문의 주제문이다. 빈칸 (1), (2)에 알맞은 말을 <보기>에서 골라 쓰시오.',
      before: 'Frances Glessner Lee contributed to the advancement of',
      mid: 'science by',
      after: 'the field of legal medicine and teaching detectives to find clues in crime scenes.',
      bank: ['military', 'forensic', 'destroying', 'developing', 'miniature'],
      accept: ['forensic', 'developing'],
      show: '(1) forensic  (2) developing',
      exp: 'forensic science는 ‘과학 수사’입니다. by + 동명사에서 developing은 teaching과 병렬을 이룹니다. (destroying은 의미상 알맞지 않습니다.)' }
  ];

  Q.forEach(function (q, i) { q.id = i + 1; });

  var app = document.getElementById('app');
  var order = [];
  var pos = 0;
  var res = {};
  var locked = false;

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function norm(s) {
    return String(s).toLowerCase()
      .replace(/[“”"‘’']/g, '')
      .replace(/-/g, ' ')
      .replace(/[.,!?;:]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }
  function correctCount(sec) {
    var n = 0, t = 0;
    Q.forEach(function (q) {
      if (sec && q.sec !== sec) return;
      t++;
      if (res[q.id] && res[q.id].ok) n++;
    });
    return { n: n, t: t };
  }

  function renderStart() {
    var rows = Object.keys(SEC).map(function (k) {
      var cnt = Q.filter(function (q) { return q.sec === k; }).length;
      return '<li><span class="l">' + k + '</span><span class="n">' + SEC[k].name.slice(3) + '</span><span class="r">' + SEC[k].range + '번 · ' + cnt + '문항</span></li>';
    }).join('');
    app.innerHTML =
      '<section class="start">' +
      '<div class="eyebrow">1학년 공통영어Ⅱ · Lesson 2</div>' +
      '<h1>본문 복습 퀴즈</h1>' +
      '<p class="sub">Frances Glessner Lee와 과학 수사 이야기를 얼마나 기억하는지 확인해 보세요. 한 문제씩 풀면 바로 정답과 해설이 나옵니다.</p>' +
      '<ul class="secs">' + rows + '</ul>' +
      '<button class="primary" id="go" type="button">퀴즈 시작하기 (총 ' + Q.length + '문항)</button>' +
      '</section>';
    document.getElementById('go').onclick = function () {
      res = {};
      order = Q.map(function (_, i) { return i; });
      pos = 0;
      renderQuiz();
    };
  }

  function renderQuiz() {
    var q = Q[order[pos]];
    locked = false;
    var boxHtml = q.box ? '<div class="box">' + q.box.map(function (l) { return '<p>' + l + '</p>'; }).join('') + '</div>' : '';
    app.innerHTML =
      '<div class="top"><div class="crumb"><span class="sec">' + SEC[q.sec].name + '</span><span class="count">' + (pos + 1) + ' / ' + order.length + '</span></div>' +
      '<div class="bar"><i style="width:' + (pos / order.length * 100) + '%"></i></div></div>' +
      '<article class="q">' +
      '<div class="qhead"><span class="tent"><b>' + q.id + '</b></span><h2>' + esc(q.stem) + '</h2></div>' +
      boxHtml +
      '<div id="ans"></div><div id="fb"></div>' +
      '</article>';
    var ans = document.getElementById('ans');

    if (q.type === 'mc') {
      ans.innerHTML = '<div class="opts" id="opts">' + q.options.map(function (t, i) {
        return '<button type="button" class="opt" data-i="' + i + '"><span class="mk">' + MARKS[i] + '</span><span class="tx">' + (q.html ? t : esc(t)) + '</span></button>';
      }).join('') + '</div>';
      Array.prototype.forEach.call(ans.querySelectorAll('.opt'), function (b) {
        b.onclick = function () { answerMC(q, Number(b.getAttribute('data-i'))); };
      });
    } else if (q.type === 'text') {
      var chips = q.chips ? '<div class="chips">' + q.chips.map(function (c) { return '<button type="button" class="chip" data-w="' + esc(c) + '">' + esc(c) + '</button>'; }).join('') + '</div>' : '';
      ans.innerHTML = '<div class="field"><label for="t">' + esc(q.hint) + '</label>' + chips +
        '<input id="t" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">' +
        '<div class="actions">' + (q.chips ? '<button type="button" class="ghost" id="clr">지우고 다시 하기</button>' : '') + '<button type="button" class="primary" id="chk">정답 확인</button></div></div>';
      var inp = document.getElementById('t');
      Array.prototype.forEach.call(ans.querySelectorAll('.chip'), function (c) {
        c.onclick = function () {
          if (locked || c.disabled) return;
          inp.value = (inp.value ? inp.value.replace(/\s+$/, '') + ' ' : '') + c.getAttribute('data-w');
          c.disabled = true;
          inp.focus();
        };
      });
      var clr = document.getElementById('clr');
      if (clr) clr.onclick = function () {
        if (locked) return;
        inp.value = '';
        Array.prototype.forEach.call(ans.querySelectorAll('.chip'), function (c) { c.disabled = false; });
        inp.focus();
      };
      inp.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); checkText(q); } };
      document.getElementById('chk').onclick = function () { checkText(q); };
    } else {
      var optsHtml = function (id) {
        return '<select id="' + id + '"><option value="">선택</option>' + q.bank.map(function (b) { return '<option value="' + b + '">' + b + '</option>'; }).join('') + '</select>';
      };
      ans.innerHTML = '<div class="field">' +
        '<p class="sentence">' + esc(q.before) + ' (1) ' + optsHtml('s1') + ' ' + esc(q.mid) + ' (2) ' + optsHtml('s2') + ' ' + esc(q.after) + '</p>' +
        '<div class="bank">&lt;보기&gt; ' + q.bank.join(' / ') + '</div>' +
        '<div class="actions"><button type="button" class="primary" id="chk">정답 확인</button></div></div>';
      document.getElementById('chk').onclick = function () { checkFill(q); };
    }
  }

  function feedback(q, ok, keyText) {
    var last = pos === order.length - 1;
    var fb = document.getElementById('fb');
    fb.innerHTML =
      '<div class="fb ' + (ok ? 'good' : 'bad') + '">' +
      '<p class="verdict">' + (ok ? '정답입니다' : '오답입니다') + '</p>' +
      (keyText ? '<p class="key">정답: ' + esc(keyText) + '</p>' : '') +
      '<p>' + esc(q.exp) + '</p></div>' +
      '<div class="actions" style="margin-top:12px"><button type="button" class="primary" id="next">' + (last ? '결과 보기' : '다음 문제') + '</button></div>';
    var nx = document.getElementById('next');
    nx.onclick = function () {
      if (last) { renderResult(); } else { pos++; renderQuiz(); window.scrollTo(0, 0); }
    };
    nx.focus({ preventScroll: true });
    fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function answerMC(q, i) {
    if (locked) return;
    locked = true;
    var ok = i === q.answer;
    res[q.id] = { ok: ok };
    var opts = document.getElementById('opts');
    opts.className = 'opts locked';
    Array.prototype.forEach.call(opts.querySelectorAll('.opt'), function (b, idx) {
      b.disabled = true;
      if (idx === q.answer) b.classList.add('right');
      else if (idx === i) b.classList.add('wrong');
    });
    feedback(q, ok, ok ? '' : MARKS[q.answer] + ' ' + stripTags(q.options[q.answer]));
  }
  function stripTags(s) { return String(s).replace(/<[^>]+>/g, ''); }

  function checkText(q) {
    if (locked) return;
    var inp = document.getElementById('t');
    var val = inp.value;
    if (!norm(val)) { inp.focus(); return; }
    locked = true;
    inp.disabled = true;
    document.getElementById('chk').disabled = true;
    var clrBtn = document.getElementById('clr');
    if (clrBtn) clrBtn.disabled = true;
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) { c.disabled = true; });
    var ok = q.accept.some(function (a) { return norm(a) === norm(val); });
    res[q.id] = { ok: ok };
    feedback(q, ok, ok ? '' : q.show);
  }

  function checkFill(q) {
    if (locked) return;
    var a = document.getElementById('s1'), b = document.getElementById('s2');
    if (!a.value || !b.value) { (a.value ? b : a).focus(); return; }
    locked = true;
    a.disabled = true; b.disabled = true;
    document.getElementById('chk').disabled = true;
    var ok = a.value === q.accept[0] && b.value === q.accept[1];
    res[q.id] = { ok: ok };
    feedback(q, ok, ok ? '' : q.show);
  }

  function renderResult() {
    var all = correctCount();
    var secRows = Object.keys(SEC).map(function (k) {
      var c = correctCount(k);
      return '<li><span class="n">' + SEC[k].name + '</span><span class="v">' + c.n + ' / ' + c.t + '</span></li>';
    }).join('');
    var cells = Q.filter(function (q) { return q.type === 'mc'; }).map(function (q) {
      var r = res[q.id];
      var st = r ? (r.ok ? 'ok' : 'no') : '';
      return '<div class="cell ' + st + '"><span>' + q.id + '.</span><span>' + MARKS[q.answer] + '</span></div>';
    }).join('');
    var subj = Q.filter(function (q) { return q.type !== 'mc'; }).map(function (q) {
      var r = res[q.id];
      return '<li><b>' + q.id + '번</b> ' + (r ? (r.ok ? '(맞음)' : '(틀림)') : '') + ' ' + esc(q.show) + '</li>';
    }).join('');
    var wrong = Q.filter(function (q) { return res[q.id] && !res[q.id].ok; });
    var msg = all.n === all.t ? '모두 맞혔습니다.' : (wrong.length + '문제를 틀렸습니다. 해설을 보고 다시 풀어 보세요.');
    app.innerHTML =
      '<section class="result">' +
      '<div class="score"><div class="eyebrow">Lesson 2 본문 복습 퀴즈</div>' +
      '<div class="big">' + all.n + '<small>/ ' + all.t + '</small></div><p style="margin:0">' + msg + '</p>' +
      '<ul class="brk">' + secRows + '</ul></div>' +
      '<div class="key-grid"><h3>객관식 정답 한눈에 보기</h3><div class="cells">' + cells + '</div>' +
      '<h3>서술형 정답</h3><ul class="subj">' + subj + '</ul></div>' +
      '<div class="row-actions">' +
      (wrong.length ? '<button type="button" class="primary" id="retry">틀린 문제 다시 풀기 (' + wrong.length + ')</button>' : '') +
      '<button type="button" class="ghost" id="again">처음부터 다시 풀기</button></div>' +
      '</section>';
    window.scrollTo(0, 0);
    var rt = document.getElementById('retry');
    if (rt) rt.onclick = function () {
      order = [];
      Q.forEach(function (q, i) { if (res[q.id] && !res[q.id].ok) { order.push(i); delete res[q.id]; } });
      pos = 0;
      renderQuiz();
      window.scrollTo(0, 0);
    };
    document.getElementById('again').onclick = renderStart;
  }

  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'SELECT') return;
    if (e.key >= '1' && e.key <= '5') {
      var opts = document.querySelectorAll('#opts .opt');
      var i = Number(e.key) - 1;
      if (!locked && opts[i]) opts[i].click();
    }
  });

  renderStart();
})();
</script>

</body></html>
